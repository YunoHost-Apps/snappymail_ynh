packaging_format = 2

id = "snappymail"
name = "SnappyMail"
description.en = "Simple, modern, lightweight & fast web-based e-mail client"
description.fr = "Client de messagerie Web simple, moderne, léger et rapide"

version = "3.0.0~ynh1"

maintainers = []

[upstream]
license = "AGPL-3.0-only"
website = "https://snappymail.eu/"
demo = "https://snappymail.eu/demo/"
admindoc = "https://github.com/the-djmaze/snappymail/wiki"
code = "https://github.com/the-djmaze/snappymail"

[integration]
yunohost = ">= 12.1.40"
helpers_version = "2.1"
architectures = "all"
multi_instance = true

ldap = false
sso = true

disk = "50M"
ram.build = "150M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/snappymail"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]

    [resources.sources]

        [resources.sources.main]
        url = "https://github.com/the-djmaze/snappymail/releases/download/v3.0.0/snappymail-3.0.0.tar.gz"
        sha256 = "ac495fb8eb95a27c3f2bfab74db0d15b12079c35ef1c533dc70504865f21d000"
        in_subdir = false
        autoupdate.strategy = "latest_github_release"
        autoupdate.asset = "^snappymail-[0-9\\.\\-]*tar.gz$"

    [resources.system_user]

    [resources.install_dir]
    group = "www-data:r-x"

    [resources.permissions]
    main.url = "/"

    [resources.apt]
    packages = [
        "mariadb-server",
        "php8.5-uuid",
        "php8.5-imagick",
        "php8.5-sqlite3",
        "php8.5-tidy",
        "php8.5-dom",
        "php8.5-intl",
        "php8.5-mysql",
        "php8.5-curl",
        "php8.5-gd",
        "php8.5-cli",
        "php8.5-xml",
        "php8.5-mbstring",
        "php8.5-ldap",
    ]

    [resources.database]
    type = "mysql"
